host_routes_not_modelled:
  count: 1174
  reason: The live route index carries 1,233 routes, but the overwhelming majority are administrative, plugin-management,
    e-commerce-admin or authenticated-only and return 401 to an anonymous caller. They are deliberately excluded
    from both the OpenAPI and the tool set — modelling them would advertise capability that no public consumer can
    reach.
  namespaces_excluded:
  - namespace: wc/v1, wc/v2, wc/v3
    note: WooCommerce admin API — orders, customers, coupons, reports, settings. Returns 401 anonymously.
  - namespace: wc-admin, wc-analytics, wc-telemetry, wc/private, wccom-site/v3
    note: WooCommerce store administration and analytics. Authenticated.
  - namespace: wc/pos/v1/catalog
    note: WooCommerce point-of-sale catalog. Authenticated.
  - namespace: jetpack/v4 and sub-namespaces
    note: Jetpack site management, sync, stats, Blaze campaigns, import, explat. Authenticated.
  - namespace: jetpack-boost/v1, my-jetpack/v1
    note: Performance scoring and product/purchase management. Authenticated.
  - namespace: mailpoet/v1
    note: Newsletter list and campaign management. Authenticated.
  - namespace: klaviyo/v1
    note: Marketing automation integration. Authenticated.
  - namespace: gf/v2
    note: 'Gravity Forms — form definitions and submitted entries. Authenticated, and deliberately untouched: entries
      are third-party PII.'
  - namespace: yoast/v1
    note: SEO admin, indexing and integrations. Only get_head is anonymous and it IS modelled.
  - namespace: redirection/v1
    note: Redirect and 404-log management. Authenticated.
  - namespace: wp-super-cache/v1
    note: Cache administration. Authenticated.
  - namespace: wpcom/v2, wpcom/v3
    note: WordPress.com integrations and blogging prompts. Authenticated.
  - namespace: wp-site-health/v1, wp-block-editor/v1, wp-abilities/v1
    note: Site health, block editor and abilities support. Authenticated.
  - namespace: woocommerce-email-editor/v1, wc-admin-email, woocommerce-analytics/v1
    note: Email editing and store analytics. Authenticated.
  - namespace: wp/v2 (write + admin subset)
    note: Blocks, templates, plugins, themes, widgets, menus, fonts, settings, revisions, autosaves, form responses.
      Authenticated.
deliberate_exclusions:
- route: /wp/v2/feedback
  reason: Jetpack form responses — submitted contact-form entries. Third-party personal data; excluded on principle.
- route: /gf/v2/entries
  reason: Gravity Forms submissions — same reason.
- route: /wc/store/v1/cart, /wc/store/v1/checkout
  reason: Session-mutating storefront operations. Not read-only; excluded from a read-only profile.
- route: /wp/v2/energyx-megamenu
  reason: Site navigation chrome, not content. No consumer value.
