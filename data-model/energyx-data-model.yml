traversal_notes:
- >-
  There is no server-side join. Every relationship above is an integer that must be resolved with a
  second request — EXCEPT via `_embed`, which inlines author, featured_media and terms under
  `_embedded` in one round trip. On this surface `_embed` is the difference between one request and
  four for a leadership record with a headshot and a type.
- >-
  featured_media is `0`, not null, when absent. Treat 0 as "no image" and never issue
  GET /wp/v2/media/0.
- >-
  The two product projections share ids. GET /wp/v2/product/8077 and
  GET /wc/store/v1/products/8077 are the same object with different field sets; the Store API
  projection is the one carrying price, currency and stock.
- >-
  Nine of the fourteen entities are site-specific custom post types registered by the theme. They
  are the EnergyX-specific value on this surface and also the part with no stability commitment —
  see lifecycle/energyx-lifecycle.yml.
