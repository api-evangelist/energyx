description: >-
  The entity-relationship graph of the public content API behind energyx.com, derived from the
  resource schemas the server publishes and the reference fields inside them. EnergyX publishes no
  object reference, so every relationship below was read off a declared schema property, not from
  documentation. The shape is the WordPress content model — a set of post-type entities, each
  optionally classified by one or more taxonomy vocabularies, all pointing at a shared media and
  author pool — with a WooCommerce storefront model bolted alongside it.
identifiers:
  scheme: integer
  detail: >-
    Every entity on this surface is keyed by a site-scoped positive integer `id`, unique across ALL
    post types because WordPress allocates them from one sequence. There are no prefixed ids
    (no `pr_`, `usr_`) — an id alone does not tell you what type it is. The `type` field on each
    record, and the `subtype` field on a search result, are what disambiguate. Every entity also
    carries a human-stable `slug` and a canonical `link` URL, both of which are better join keys
    for anything cross-referencing the website.
  observed_range: 'ids seen from 47 (taxonomy terms) to 11324 (a 2026-07 press release)'
