aid: energyx
name: EnergyX
description: 'EnergyX (Energy Exploration Technologies, Inc.) is a critical-materials technology company
  founded in 2018 by Teague Egan and headquartered in Austin, Texas, with operations in Texarkana, Antofagasta
  in Chile, and San Juan, Puerto Rico. It develops direct lithium extraction (DLE) technology — a modular,
  brine-agnostic flow sheet combining adsorbents, solvent extraction and its own selective membranes under
  the GET-Lit platform — together with SoLiS lithium-metal battery technology and NUKE-it membranes for
  lithium-6/7 isotope separation and nuclear fuel-cycle applications. The company produces lithium hydroxide,
  lithium carbonate and lithium dihydrogen phosphate, holds a large patent portfolio, and controls lithium
  resources in Chile and the United States including the Black Giant project. EnergyX is a materials and
  process-technology company rather than a software vendor: it publishes no developer program, no API
  documentation, no SDKs and no developer portal. The only machine-readable interface it exposes is the
  WordPress REST content API behind its corporate website at energyx.com, which is captured here for discovery
  purposes and is anonymously readable but read-only.'
url: https://raw.githubusercontent.com/api-evangelist/energyx/refs/heads/main/apis.yml
image: https://energyx.com/app/uploads/2020/03/android-chrome-384x384-1.png
