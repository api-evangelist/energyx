    Product:
      $schema: http://json-schema.org/draft-04/schema#
      title: product
      type: object
      properties:
        date:
          description: The date the post was published, in the site's timezone.
          type:
          - string
          - 'null'
          format: date-time
        date_gmt:
          description: The date the post was published, as GMT.
          type:
          - string
          - 'null'
          format: date-time
        guid:
          description: The globally unique identifier for the post.
          type: object
          properties:
            raw:
              description: GUID for the post, as it exists in the database.
              type: string
            rendered:
              description: GUID for the post, transformed for display.
              type: string
        id:
          description: Unique identifier for the post.
          type: integer
        link:
          description: URL to the post.
          type: string
          format: uri
        modified:
          description: The date the post was last modified, in the site's timezone.
          type: string
          format: date-time
        modified_gmt:
          description: The date the post was last modified, as GMT.
          type: string
          format: date-time
        slug:
          description: An alphanumeric identifier for the post unique to its type.
          type: string
        status:
          description: A named status for the post.
          type: string
          enum:
          - publish
          - future
          - draft
          - pending
          - private
          - acf-disabled
          - wc-pending
          - wc-processing
          - wc-on-hold
          - wc-completed
          - wc-cancelled
          - wc-refunded
          - wc-failed
          - wc-checkout-draft
          - wc-active
          - wc-switched
          - wc-expired
          - wc-pending-cancel
          - spam
          - moderate
          - private_post
        type:
          description: Type of post.
          type: string
        password:
          description: A password to protect access to the content and excerpt.
          type: string
        permalink_template:
          description: Permalink template for the post.
          type: string
        generated_slug:
          description: Slug automatically generated from the post title.
          type: string
        class_list:
          description: An array of the class names for the post container element.
          type: array
          items:
            type: string
        title:
          description: The title for the post.
          type: object
          properties:
            raw:
              description: Title for the post, as it exists in the database.
              type: string
            rendered:
              description: HTML title for the post, transformed for display.
              type: string
        content:
          description: The content for the post.
          type: object
          properties:
            raw:
              description: Content for the post, as it exists in the database.
              type: string
            rendered:
              description: HTML content for the post, transformed for display.
              type: string
            block_version:
              description: Version of the content block format used by the post.
              type: integer
            protected:
              description: Whether the content is protected with a password.
              type: boolean
        excerpt:
          description: The excerpt for the post.
          type: object
          properties:
            raw:
              description: Excerpt for the post, as it exists in the database.
              type: string
            rendered:
              description: HTML excerpt for the post, transformed for display.
              type: string
            protected:
              description: Whether the excerpt is protected with a password.
              type: boolean
        featured_media:
          description: The ID of the featured media for the post.
          type: integer
        comment_status:
          description: Whether or not comments are open on the post.
          type: string
          enum:
          - open
          - closed
        ping_status:
          description: Whether or not the post can be pinged.
          type: string
          enum:
          - open
          - closed
        meta:
          description: Meta fields.
          type: object
          properties:
            inline_featured_image:
              type: boolean
              title: ''
              description: ''
        template:
          description: The theme file to use to display the post.
          type: string
        product_brand:
          description: The terms assigned to the post in the product_brand taxonomy.
          type: array
          items:
            type: integer
        product_cat:
          description: The terms assigned to the post in the product_cat taxonomy.
          type: array
          items:
            type: integer
        product_tag:
          description: The terms assigned to the post in the product_tag taxonomy.
          type: array
          items:
            type: integer
        jetpack_sharing_enabled:
          description: Are sharing buttons enabled?
          type: boolean
      links:
      - rel: https://api.w.org/action-publish
        title: The current user can publish this post.
        href: https://energyx.com/wp-json/wp/v2/product/{id}
        targetSchema:
          type: object
          properties:
            status:
              type: string
              enum:
              - publish
              - future
      - rel: https://api.w.org/action-unfiltered-html
        title: The current user can post unfiltered HTML markup and JavaScript.
        href: https://energyx.com/wp-json/wp/v2/product/{id}
        targetSchema:
          type: object
          properties:
            content:
              raw:
                type: string
      - rel: https://api.w.org/action-assign-product_brand
        title: The current user can assign terms in the product_brand taxonomy.
        href: https://energyx.com/wp-json/wp/v2/product/{id}
        targetSchema:
          type: object
          properties:
            product_brand:
              type: array
              items:
                type: integer
      - rel: https://api.w.org/action-create-product_brand
        title: The current user can create terms in the product_brand taxonomy.
        href: https://energyx.com/wp-json/wp/v2/product/{id}
        targetSchema:
          type: object
          properties:
            product_brand:
              type: array
              items:
                type: integer
      - rel: https://api.w.org/action-assign-product_cat
        title: The current user can assign terms in the product_cat taxonomy.
        href: https://energyx.com/wp-json/wp/v2/product/{id}
        targetSchema:
          type: object
          properties:
            product_cat:
              type: array
              items:
                type: integer
      - rel: https://api.w.org/action-create-product_cat
        title: The current user can create terms in the product_cat taxonomy.
        href: https://energyx.com/wp-json/wp/v2/product/{id}
        targetSchema:
          type: object
          properties:
            product_cat:
              type: array
              items:
                type: integer
      - rel: https://api.w.org/action-assign-product_tag
        title: The current user can assign terms in the product_tag taxonomy.
        href: https://energyx.com/wp-json/wp/v2/product/{id}
        targetSchema:
          type: object
          properties:
            product_tag:
